name: workdoc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workdoc
      POSTGRES_USER: workdoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/ec2/.env}
    volumes:
      - workdoc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workdoc -d workdoc"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://workdoc:${POSTGRES_PASSWORD}@db:5432/workdoc
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/ec2/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en deploy/ec2/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en deploy/ec2/.env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    command: ["sh", "-c", "node backend/db/init.js && exec node server.js"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

networks:
  internal:

volumes:
  workdoc_data:
